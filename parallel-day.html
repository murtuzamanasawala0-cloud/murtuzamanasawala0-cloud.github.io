<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The day that never happened</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f3e7ef;--ink2:#bda8bb;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
/* a display: rule beats the hidden attribute, and an invisible overlay that
   still eats taps is the worst kind of bug — this has bitten twice */
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#000;color:var(--ink);
 font:400 16px/1.6 'Lora',Georgia,serif;-webkit-font-smoothing:antialiased}

/* the whole screen is the thing she sees — nothing else */
#stagebox{position:fixed;inset:0}
#pcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pgarden{position:absolute;left:0;right:0;bottom:0;height:88px;width:100%;
 pointer-events:none;opacity:.9}

/* the app's own header, drained */
.chrome{position:absolute;left:0;right:0;
 top:calc(env(safe-area-inset-top,0px));
 display:flex;align-items:center;justify-content:space-between;
 padding:16px 20px;pointer-events:none;transition:opacity .6s}
#ptitle{font-family:'Playfair Display',serif;font-size:15px}
#pclock{font:500 12.5px/1 'IBM Plex Mono',ui-monospace,monospace;color:var(--ink2);
 letter-spacing:.06em;font-variant-numeric:tabular-nums}
body[data-dead="0"] #pclock{color:#ffd9e8}

/* what she taps during the opening */
.choice{position:absolute;left:0;right:0;bottom:16%;
 display:flex;flex-direction:column;gap:11px;align-items:center;padding-inline:26px}
.choice button{width:100%;max-width:300px;border:1px solid rgba(255,255,255,.2);
 background:rgba(255,255,255,.08);color:var(--ink);
 font:500 15.5px/1 'Lora',serif;padding:14px 18px;border-radius:999px;cursor:pointer}
.choice button.go{background:#d4467c;border-color:#d4467c;color:#fff}
.choice button:active{transform:scale(.98)}

/* the "are you sure" note */
.ask{position:fixed;inset:0;background:rgba(6,4,9,.82);backdrop-filter:blur(3px);
 display:flex;align-items:center;justify-content:center;padding:22px;z-index:30}
.askbox{background:#241a2e;border:1px solid rgba(255,255,255,.14);border-radius:18px;
 padding:22px 22px 18px;max-width:340px}
.askhead{font-family:'Playfair Display',serif;font-size:19px;margin:0 0 10px}
.askbox p{margin:0 0 11px;font-size:15px;line-height:1.55;color:#d8c6d4}
.askrow{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.askrow button{width:100%;border:1px solid #d4467c;background:#d4467c;color:#fff;
 font:500 15px/1 'Lora',serif;padding:13px 18px;border-radius:999px;cursor:pointer}
.askrow button.ghost{background:transparent;border-color:rgba(255,255,255,.18);color:#d8c6d4}

/* a quiet strip of bench controls that can be got rid of entirely */
.bench{position:fixed;left:0;right:0;
 bottom:calc(env(safe-area-inset-bottom,0px));
 display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;
 padding:9px 12px;background:rgba(8,5,12,.72);backdrop-filter:blur(6px);z-index:20;
 transition:transform .35s,opacity .35s}
body[data-bench="0"] .bench{transform:translateY(120%);opacity:0;pointer-events:none}
.bench button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
 color:var(--ink);font:500 12.5px/1 'Lora',serif;padding:9px 13px;border-radius:999px;cursor:pointer}
.bench #pnext{background:#d4467c;border-color:#d4467c;color:#fff}
#pwhere{flex:1 1 100%;text-align:center;font:500 10.5px/1.4 'IBM Plex Mono',ui-monospace,monospace;
 color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
#pshow{position:fixed;right:10px;
 bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:21;
 border:1px solid rgba(255,255,255,.16);background:rgba(8,5,12,.7);color:var(--ink2);
 font:500 11px/1 'Lora',serif;padding:9px 12px;border-radius:999px;cursor:pointer}
body[data-bench="1"] #pshow{display:none}
</style>
</head>
<body data-dead="1" data-bench="1">

<div id="stagebox">
  <canvas id="pcv"></canvas>
  <canvas id="pgarden"></canvas>
  <div class="chrome">
    <span id="ptitle">30 days · for Zahabiya</span>
    <span id="pclock">27 days · 4 hrs · 11 min</span>
  </div>
  <div class="choice" id="pchoice" hidden>
    <button class="go" id="pYes">Show me</button>
    <button id="pNo">I don't want to see</button>
  </div>
</div>

<div class="ask" id="pask" hidden>
  <div class="askbox">
    <p class="askhead">You want to stop.</p>
    <p>That's completely fine. I'd rather you were alright than that you saw all of it.</p>
    <p>It doesn't skip anything — it takes you straight to the good part, which is the part I actually wanted you to have.</p>
    <div class="askrow">
      <button id="paskGo">Take me to the end</button>
      <button id="paskStay" class="ghost">I'll keep going</button>
    </div>
  </div>
</div>

<div class="bench">
  <span id="pwhere"></span>
  <button id="pnext">next →</button>
  <button id="pstop" hidden>I want to stop</button>
  <button id="prestart">restart</button>
  <button id="phide">hide this</button>
</div>
<button id="pshow">bench</button>

<script>
(()=>{
'use strict';

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let CLOCK=null;
const now=()=>CLOCK?new Date(CLOCK):new Date();
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const dateOf=d=>new Date(2026,8,17+d);
const ASCENES={}; let ATXT={};
let DAYS=Array.from({length:30},(_,i)=>({a:'',t:'',m:'',n:''}));
let S={done:{},unlocked:{},marks:{},reply:{}};
const save=()=>{};
let mode='day',cleanup=null;
const sparkle=()=>{};
const GARDEN={highlight(){},frontPoint(){return null}};
const AUDIO={setMode(){},fx(){},wake(){}};
let STAGE=null;
function show(html){STAGE.innerHTML='';const w=el('div','view',html);STAGE.appendChild(w);return w}
const openEditor=()=>{};
function animView(){}

/* ================= the thirty seconds before the note =================
   One engine, many scenes. A scene is data: how it draws, how long it runs,
   what words float over it, and the one small mark it leaves behind on the
   mural she never sees until the last day.                                */

/* ---- what time is it, and what colour is that ---- */
const APAL={
 morning:{a:'#ffe9d6',b:'#ffd6e6',ink:'#5c3b4d',glow:'#ffb48c',star:.10,label:'morning'},
 day    :{a:'#e8f1ff',b:'#ffe6f1',ink:'#4b3a54',glow:'#ffd394',star:.04,label:'afternoon'},
 dusk   :{a:'#ff9f7a',b:'#7d5aa8',ink:'#fff2f8',glow:'#ffc98f',star:.40,label:'dusk'},
 evening:{a:'#3a2a5e',b:'#7a4a78',ink:'#ffeaf4',glow:'#ffc07a',star:.75,label:'evening'},
 late   :{a:'#141029',b:'#2e1f46',ink:'#ffe4f0',glow:'#9fb8ff',star:1,  label:'late'}
};
function todKey(){
 const h=now().getHours();
 if(h>=5&&h<11)return 'morning';
 if(h>=11&&h<16)return 'day';
 if(h>=16&&h<19)return 'dusk';
 if(h>=19&&h<23)return 'evening';
 return 'late';
}
function apal(){const p=APAL[todKey()]||APAL.evening;return Object.assign({dark:p.star>.35},p)}

/* ---- small shared maths ---- */
const aEase=v=>v<=0?0:v>=1?1:v*v*(3-2*v);
const aSeg=(v,a,b)=>aEase((v-a)/(b-a));
const aLerp=(a,b,t)=>a+(b-a)*t;
function aMix(c1,c2,t){
 const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
 const[a,b]=[p(c1),p(c2)];
 return`rgb(${a.map((v,i)=>Math.round(aLerp(v,b[i],t))).join(',')})`;
}
/* a deterministic little random, so a day always looks the same to her */
function aRng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}

/* ---- sampling points out of a shape, used by several scenes ---- */
const _shapeCache={};
function shapePoints(text,n,w,h){
 const key=text+'|'+n+'|'+Math.round(w)+'x'+Math.round(h);
 if(_shapeCache[key])return _shapeCache[key];
 const c=document.createElement('canvas');
 c.width=Math.max(8,Math.round(w));c.height=Math.max(8,Math.round(h));
 const x=c.getContext('2d',{willReadFrequently:true});
 let size=Math.min(c.width,c.height)*.92;
 x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';
 x.font=`700 ${size}px "Playfair Display",Georgia,serif`;
 /* shrink until it fits the box */
 for(let i=0;i<6&&x.measureText(text).width>c.width*.95;i++){
  size*=c.width*.95/x.measureText(text).width;
  x.font=`700 ${size}px "Playfair Display",Georgia,serif`;
 }
 x.fillText(text,c.width/2,c.height/2);
 let img;try{img=x.getImageData(0,0,c.width,c.height).data}catch(e){return _shapeCache[key]=[]}
 const hits=[];
 for(let py=0;py<c.height;py+=2)for(let px=0;px<c.width;px+=2)
  if(img[(py*c.width+px)*4+3]>128)hits.push([px,py]);
 const out=[];
 if(!hits.length)return _shapeCache[key]=[];
 for(let i=0;i<n;i++)out.push(hits[Math.floor(i*hits.length/n)]);
 /* shuffle deterministically so they don't fill top-to-bottom */
 const r=aRng(text.length+n);
 for(let i=out.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
 return _shapeCache[key]=out.map(([px,py])=>({x:px,y:py}));
}

/* ================= the scenes ================= */
/* ASCENES and ATXT are declared at the very top of the app, because
   applyContent() reads them at load. Each scene is:
     {name,grp,blurb,dur,def,fields,init,draw,mark}
   init(A,W,H,R)         — build state on A, R is the seeded random
   draw(A,c,W,H,t,P,pal) — t seconds, P is 0..1 through the scene
   mark(c,s,R)           — the keepsake, in a box of size s, origin 0,0 */

function AT(k,f){
 const o=ATXT[k]&&typeof ATXT[k][f]==='string'?ATXT[k][f].trim():'';
 if(o)return o;
 const d=((ASCENES[k]||{}).def||{})[f];
 return Array.isArray(d)?d.join('\n'):(d==null?'':String(d));
}
function AL(k,f){return AT(k,f).split('\n').map(s=>s.trim()).filter(Boolean)}
/* the lines that float over a scene */
const aWords=k=>AL(k,'words');

/* When each line arrives, and when it leaves.

   A scene's cue can be a single number (arrive here, stay until the next
   line) or a pair [arrive, leave]. The pair is the one that matters: a beat's
   last line has to clear the screen when its picture does, not when the next
   line turns up, or the words about the spreadsheet are still sitting there
   while the formula walks in. Scenes with no cues keep the even spread. */
function aCues(sc,words){
 const n=words.length;
 const c0=sc.solo?0.08:0.16, c1=sc.solo?0.88:0.72;
 const raw=(sc.cues&&sc.cues.length>=n)
  ? sc.cues.slice(0,n)
  : words.map((_,i)=>c0+(c1-c0)*(n===1?0.25:i/(n-1)));
 const ins=raw.map(v=>Array.isArray(v)?v[0]:v);
 const outs=raw.map((v,i)=>Array.isArray(v)&&v.length>1?v[1]:2);
 return {ins:ins,outs:outs};
}

/* which animation runs on a given day */
function animFor(d){
 const D=DAYS[d-1];
 const k=D&&D.a;
 return (k&&ASCENES[k])?k:'';
}
function animDur(k){
 const v=parseFloat(AT(k,'dur'));
 if(isFinite(v)&&v>=4&&v<=60)return v;
 return (ASCENES[k]||{}).dur||14;
}

/* ================= the mural she doesn't know about ================= */
/* Every animation she finishes leaves one mark. Thirty days later it's a picture. */
function addMark(d,k){
 if(!S.marks)S.marks={};
 if(S.marks[d])return;
 S.marks[d]=k;save();
}
function muralSpots(n){
 /* Laid out along a heart, day one to day twenty-nine, going round.
    A spiral just looked like spilled stickers; this reads as one thing. */
 const out=[];
 for(let i=0;i<n;i++){
  const t=-Math.PI/2+(i/n)*Math.PI*2;          // start at the top, go round
  const hx=Math.pow(Math.sin(t),3);
  const hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16;
  /* a little wobble so it's hand-made rather than plotted */
  const r=aRng(i*13+5);
  out.push({x:.5+hx*.36+(r()-.5)*.028,
            y:.5+hy*.34+(r()-.5)*.028+.02,
            s:.92+(i%3)*.06});
 }
 return out;
}
function drawMural(cv){
 const dp=Math.min(devicePixelRatio||1,2);
 const W=cv.clientWidth||300,H=cv.clientHeight||300;
 cv.width=W*dp;cv.height=H*dp;
 const c=cv.getContext('2d');c.setTransform(dp,0,0,dp,0,0);
 const pal=apal();
 const g=c.createLinearGradient(0,0,W,H);
 g.addColorStop(0,'#1a1130');g.addColorStop(1,'#43254a');
 c.fillStyle=g;c.fillRect(0,0,W,H);
 /* a faint dust of stars underneath */
 const r0=aRng(11);
 c.fillStyle='rgba(255,255,255,.28)';
 for(let i=0;i<70;i++){const x=r0()*W,y=r0()*H,s=r0()*1.3+.3;c.beginPath();c.arc(x,y,s,0,7);c.fill()}
 const days=[];for(let d=1;d<=29;d++)if(S.marks&&S.marks[d])days.push(d);
 const spots=muralSpots(29);

 /* the thread running through them, in the order she did them */
 if(days.length>1){
  c.strokeStyle='rgba(255,210,232,.22)';c.lineWidth=1.1;c.lineCap='round';
  c.beginPath();
  days.forEach((d,i)=>{const s=spots[d-1];if(!s)return;
   const x=s.x*W,y=s.y*H;i?c.lineTo(x,y):c.moveTo(x,y)});
  c.stroke();
 }

 days.forEach(d=>{
  const k=S.marks[d],sc=ASCENES[k];
  const sp=spots[d-1];if(!sp)return;
  const base=Math.min(W,H)*0.062*sp.s;
  c.save();
  c.translate(sp.x*W-base/2,sp.y*H-base/2);
  c.globalAlpha=.94;
  try{(sc&&sc.mark?sc.mark:defaultMark)(c,base,aRng(d*17+3),pal)}catch(e){}
  c.restore();
 });
 return days.length;
}
function defaultMark(c,s){
 c.fillStyle='#ffd9e8';c.beginPath();c.arc(s/2,s/2,s*.22,0,7);c.fill();
}

/* ================= the stage ================= */
let ASTOP=null;
function stopAnim(){if(ASTOP){try{ASTOP()}catch(e){}ASTOP=null}}

/* forceKey plays a named scene on this day instead of the day's own one —
   that's how a day can have a second animation after the note. */
function animView(d,onDone,replay,forceKey){
 const k=(forceKey&&ASCENES[forceKey])?forceKey:animFor(d);
 if(!k||!ASCENES[k]){onDone();return}
 const sc=ASCENES[k],pal=apal(),dur=animDur(k),words=aWords(k);
 mode='anim';
 const w=show(`<div class="animwrap" id="awrap">
   <canvas id="acv"></canvas>
   <div class="animtext" id="atext">${words.map((l,i)=>`<p style="--i:${i}">${l}</p>`).join('')}</div>
   <button class="animskip" id="askip" hidden>skip</button>
  </div>`);
 const wrap=$('#awrap',w),cv=$('#acv',w),tx=$('#atext',w),skip=$('#askip',w);
 if(sc.solo)tx.classList.add('solo');   /* the lines share one spot instead of stacking */
 /* A scene that paints its own pale ground cannot use the clock's ink: at
    night that ink is nearly white, and white on cream is not text. Such a
    scene says so, and gets dark letters and a pale scrim instead. */
 /* A scene that paints its own ground has to say which kind, or it gets the
    clock's ink: pale letters on a cream field at night, or dark letters on a
    midnight field in the morning. Either way, unreadable. */
 wrap.dataset.tod=sc.light?'day':sc.dark?'late':todKey();
 wrap.style.setProperty('--aink',
   sc.light?'#4a3142':sc.dark?'#ffe4f0':pal.ink);
 const c=cv.getContext('2d');
 let W=0,H=0,raf=0,t0=0,last=0,t=0,ended=false;
 const A={pal,rng:aRng(d*31+7),day:d,key:k,words};
 /* a scene that needs her to do something holds the ending open and
    finishes itself, instead of the clock finishing it */
 A.hold=!!sc.hold;
 A.words=words;

 function size(){
  const dp=Math.min(devicePixelRatio||1,2);
  W=wrap.clientWidth||innerWidth;H=wrap.clientHeight||Math.round(innerHeight*.62);
  cv.width=W*dp;cv.height=H*dp;c.setTransform(dp,0,0,dp,0,0);
  A.W=W;A.H=H;
  try{sc.init&&sc.init(A,W,H,A.rng)}catch(e){}
 }
 function bg(){
  const g=c.createLinearGradient(0,0,0,H);
  /* a scene can paint its own ground — the parallel universe drains it */
  const pa=A.bgA||pal.a, pb=A.bgB||pal.b;
  g.addColorStop(0,pa);g.addColorStop(1,pb);
  c.fillStyle=g;c.fillRect(0,0,W,H);
 }
 /* the words come in on their own schedule, spread through the scene */
 /* A scene with beats places its own lines against them: an even spread
    makes a line about the scooter turning round arrive two seconds before
    the scooter turns round, which reads as the words not matching at all.
    Scenes without beats still get the even spread. */
 const CU=aCues(sc,words), cues=CU.ins, outs=CU.outs;
 let shownTo=-1;

 /* time lost to an interruption, given back rather than charged to her */
 let frozen=0;
 function frame(n){
  if(!t0){t0=n;last=n}
  /* motion uses frame time (clamped, so a stall doesn't teleport anything),
     but how far through the scene we are is wall clock — otherwise a slow
     phone quietly stretches a 15-second film into half a minute. */
  const raw=n-last;
  const dt=Math.min(.05,raw/1000);last=n;
  /* while something is sitting on top of the film, the film waits: she should
     not have to watch an advert AND miss the bit underneath it */
  const covered=!!wrap.querySelector('.pkon');
  if(covered)frozen+=raw;else t+=dt;
  /* a holding scene sits at the end of its timeline until it says otherwise */
  let P=Math.min(1,(n-t0-frozen)/1000/dur);
  if(A.hold&&P>=1)P=1;
  bg();
  try{sc.draw(A,c,W,H,t,P,pal)}catch(e){}
  /* the smallest settle at the very end, so the handover isn't a hard cut */
  if(P>.94)wrap.style.opacity=String(1-(P-.94)/.06*0.15);
  for(let i=shownTo+1;i<cues.length;i++)if(P>=cues[i]){
   /* a solo scene shows one line at a time — otherwise five lines pile up
      and the picture ends up underneath the words */
   if(sc.solo&&shownTo>=0){const q=tx.children[shownTo];if(q)q.classList.remove('in')}
   const p=tx.children[i];if(p)p.classList.add('in');shownTo=i;
  }
  /* and it goes when its picture goes */
  if(shownTo>=0&&P>=outs[shownTo]){
   const q=tx.children[shownTo];if(q)q.classList.remove('in');
  }
  if(P>=1&&!ended&&!A.hold){ended=true;finish();return}
  raf=requestAnimationFrame(frame);
 }
 /* a scene can bring its own music; it has to go quiet whichever way this ends */
 let soundOff=null;
 const endSound=()=>{if(soundOff){try{soundOff()}catch(e){}soundOff=null}};
 function finish(){
  endSound();
  if(raf)cancelAnimationFrame(raf);raf=0;
  if(!replay){addMark(d,k);flowerMoment();}
  setTimeout(()=>{if(mode==='anim')onDone()},replay?420:900);
 }
 const stop=()=>{endSound();if(raf)cancelAnimationFrame(raf);raf=0;ASTOP=null};
 ASTOP=stop;cleanup=stop;

 /* a scene that takes taps gets them in its own coordinates */
 if(sc.tap){
  const hit=e=>{
   e.preventDefault();
   const r=cv.getBoundingClientRect();
   try{sc.tap(A,e.clientX-r.left,e.clientY-r.top,W,H)}catch(err){}
  };
  cv.style.touchAction='none';
  cv.addEventListener('pointerdown',hit,{passive:false});
 }
 /* a holding scene calls this when she has finished whatever it asked */
 A.release=()=>{
  if(ended||!A.hold)return;
  A.hold=false;
 };
 /* extra lines a scene wants to put up itself, beyond the timed ones */
 A.say=(txt)=>{
  const p=document.createElement('p');
  p.textContent=txt;tx.appendChild(p);
  requestAnimationFrame(()=>p.classList.add('in'));
 };
 A.clearWords=()=>{tx.innerHTML='';shownTo=cues.length};

 /* she can always get past it — but not instantly, or it's just a button */
 setTimeout(()=>{if(mode==='anim'&&!sc.noskip)skip.hidden=false},4200);
 skip.onclick=()=>{if(ended)return;ended=true;stop();
  if(!replay){addMark(d,k);flowerMoment()}
  onDone();};

 size();
 addEventListener('resize',size);
 const offResize=()=>removeEventListener('resize',size);
 const prevStop=stop;
 ASTOP=()=>{offResize();prevStop()};cleanup=ASTOP;
 /* the background track steps aside for a scene that plays its own */
 if(sc.sound){AUDIO.setMode('none');try{soundOff=sc.sound(A,dur)}catch(e){}}
 else AUDIO.setMode('read');
 raf=requestAnimationFrame(frame);
}

/* A small door, so the scenes can be driven from outside while they're being
   built. Nothing here shows up in the app; she will never open a console. */
try{window.__zb={
 ASCENES,DAYS,S,animView,drawMural,animFor,animDur,aWords,apal,todKey,
 txt:()=>ATXT, setTxt(v){ATXT=v||{}}, save,
 openEditor:d=>openEditor(d)
}}catch(e){}

/* the day's flower opens while she's still looking at it */
function flowerMoment(){
 try{
  GARDEN.highlight&&GARDEN.highlight();
  const p=GARDEN.frontPoint&&GARDEN.frontPoint();

/* ================= colour, and the absence of it =================
   Shared by every scene: the drain, the text that has to read on a ground
   which changes underneath it, and a wrapper. */

/* ---- colour, and the absence of it ---- */
function aHexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function aGreyOf(h){
 const[r,g,b]=aHexRGB(h);
 const y=Math.round(0.299*r+0.587*g+0.114*b);
 return`rgb(${y},${y},${y})`;
}
/* k = 0 fully drained, 1 fully itself.
   At k=0 this is a flat luminance grey and nothing else — the drained world
   is black, grey and white, with no hue left anywhere in it. */
function aCol(hex,k){
 if(k>=1)return hex;
 const[r,g,b]=aHexRGB(hex);
 const y=0.299*r+0.587*g+0.114*b;
 const m=c=>Math.round(Math.max(0,Math.min(255,y+(c-y)*k)));
 return`rgb(${m(r)},${m(g)},${m(b)})`;
}
/* the ground goes from near-black to pink while this text is on screen,
   so every line gets a shadow in the opposite direction and reads on both */
function aGlowText(c,light){
 c.shadowColor=light?'rgba(20,12,26,.75)':'rgba(255,240,248,.85)';
 c.shadowBlur=10;c.shadowOffsetY=light?1:0;
 c.fillStyle=light?'#f6ecf4':'#3f2838';
}
function aClearShadow(c){c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0}
function aWrap(c,text,maxW){
 const out=[],words=String(text).split(' ');let cur='';
 words.forEach(w=>{const t=cur?cur+' '+w:w;
  if(c.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t});
 if(cur)out.push(cur);
 return out;
}

 init(A,W,H){A.done=false},
 /* a forearm coming in from the edge of frame: sleeve, arm, a simple hand.
    The first version drew soft blobs and they read as nothing at all. */
 wrist(c,x,y,L,T,dir,skin,cuff){
  c.save();c.translate(x,y);c.scale(dir,1);

  c.quadraticCurveTo(handX+L*.17,-T*.02,handX+L*.13,T*.24);
  c.quadraticCurveTo(handX+L*.06,T*.50,wristX,T*.34);

  c.save();c.translate(x,y);c.rotate(tilt);

  c.beginPath();c.ellipse(0,0,rx,ry*(squash||1),0,0,7);c.stroke();

  const cross=aSeg(P,.38,.72);
  const land =aSeg(P,.72,.90);
  const rest =aSeg(P,.90,1);

  const g=c.createRadialGradient(W/2,cy,0,W/2,cy,W*.75);
  g.addColorStop(0,pal.dark?'rgba(255,224,240,.13)':'rgba(255,255,255,.45)');

  const s=Math.min(pw,ph)/120*1.15;
  const sy=py+ph*.52;
  /* the shirts: same colour all along, which is the whole point */
  c.globalAlpha=show;

  c.globalAlpha=show*alphaR;
  this.shirt(c,rx+pw/2,sy,s,'#f3a8c2');

  c.save();

  heads.forEach(([hx,hy])=>{c.beginPath();c.moveTo(0,6);c.lineTo(hx*o,hy*o);c.stroke()});

   const r=(4.4+(i%2)*1.5)*o;

  /* the door */
  aShadow(c,()=>{c.fillStyle=aMix('#8d6a76','#c99a86',clearing);aRR(c,dx,dy,doorW,doorH,10);c.fill()});
  c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=1.4;
  aRR(c,dx+doorW*.12,dy+doorH*.10,doorW*.76,doorH*.34,6);c.stroke();
  aRR(c,dx+doorW*.12,dy+doorH*.52,doorW*.76,doorH*.34,6);c.stroke();
  c.fillStyle=aMix('#d8c48f','#f0d79a',clearing);
  c.beginPath();c.arc(dx+doorW*.86,dy+doorH*.52,Math.max(3,doorW*.032),0,7);c.fill();
  /* the step */
  c.fillStyle=`rgba(80,60,72,${.35-.12*clearing})`;

   const d=A.d[i];

   const drop=aEase(Math.min(1,arrive*1.25));

 },

 fries(c,x,y,s,pulse){

ASCENES.call={

 blurb:'Two phones, and three words making the trip between them.',

  aShadow(c,()=>{
   c.fillStyle='#3b2b3e';aRR(c,x-w/2,y-h/2,w,h,w*.17);c.fill();

  c.fillStyle=lit?'#ffe9f3':'#5d4a60';

 },
 draw(A,c,W,H,t,P,pal){
  const pw=Math.min(W*.20,H*.14), ph=pw*2.0;
  const ax=W*.24, ay=H*.30, bx=W*.76, by=H*.70;
  const travel=aSeg(P,.22,.66);
  const landed=aSeg(P,.66,.90);

  /* the line between them */
  c.strokeStyle=pal.dark?'rgba(255,214,235,.22)':'rgba(140,90,120,.22)';
  c.setLineDash([3,8]);c.lineWidth=1.2;
  /* the line is live from the first frame -- the call is already connected */
  c.lineDashOffset=-(t*14)%11;
  c.beginPath();c.moveTo(ax,ay);c.quadraticCurveTo(W*.5,H*.40,bx,by);c.stroke();
  c.setLineDash([]);c.lineDashOffset=0;
  /* and a phone that is mid-call has a screen that is doing something */
  const pulse=.10+.06*Math.sin(t*2.6);
  const pg2=c.createRadialGradient(ax,ay,0,ax,ay,pw*1.5);
  pg2.addColorStop(0,`rgba(232,114,154,${pulse})`);
  pg2.addColorStop(1,'rgba(232,114,154,0)');

  this.phone(c,bx,by,pw,ph,landed>0,pal);

  if(travel>0&&landed<1){
   const e=aEase(travel);
   const px=(1-e)*(1-e)*ax+2*(1-e)*e*W*.5+e*e*bx;

   for(let i=-4;i<=4;i++){
    const hgt=span*(.25+.75*Math.abs(Math.sin(t*5+i*.8)))*(1-Math.abs(i)/5.5);

    if(c.measureText(tryl).width>pw*.74&&cur){lines.push(cur);cur=w}else cur=tryl});
   if(cur)lines.push(cur);
   const lh=pw*.22;
   lines.forEach((l,i)=>c.fillText(l,bx,by-(lines.length-1)*lh/2+i*lh));
   c.restore();
   if(landed>.85){
    const a=(landed-.85)/.15;
    const gg=c.createRadialGradient(bx,by,0,bx,by,pw*2.2);
    gg.addColorStop(0,`rgba(255,180,210,${.30*a})`);
    gg.addColorStop(1,'rgba(255,180,210,0)');

  c.quadraticCurveTo(S*.44,-S*.26,S*.50,-S*.52);
  c.lineTo(S*.66,-S*.50);
  c.quadraticCurveTo(S*.58,-S*.12,S*.52,S*.16);
  c.closePath();c.fill();
  /* handlebar */
  c.strokeStyle=body;c.lineWidth=Math.max(2,S*.05);c.lineCap='round';
  c.beginPath();c.moveTo(S*.42,-S*.58);c.lineTo(S*.74,-S*.62);c.stroke();
  /* the seat, and the empty half of it */
  c.fillStyle=trim;
  aRR(c,-S*.62,-S*.36,S*.56,S*.15,S*.07);c.fill();
  c.setLineDash([3,5]);
  c.strokeStyle=aCol('#c98aa8',Math.max(k,.30));c.lineWidth=1.6;
  c.beginPath();c.ellipse(-S*.40,-S*.40,S*.20,S*.085,-.10,0,7);c.stroke();
  c.setLineDash([]);
  c.restore();
 },
 onePlate(c,x,y,S,k){
  c.save();c.translate(x,y);
  c.fillStyle=aCol('#efe6ec',k);
  c.beginPath();c.ellipse(0,S*.30,S*.92,S*.34,0,0,7);c.fill();
  c.strokeStyle=aCol('#d5c6d0',k);c.lineWidth=1.2;
  c.beginPath();c.ellipse(0,S*.30,S*.70,S*.24,0,0,7);c.stroke();
  const st=c.fillStyle;
  c.save();
  /* one puri, and nothing poured into it */
  const g=c.createRadialGradient(-S*.12,-S*.08,S*.03,0,S*.02,S*.40);
  g.addColorStop(0,aCol('#f6dcae',k));
  g.addColorStop(.6,aCol('#e6c088',k));
  g.addColorStop(1,aCol('#c99b5f',k));
  c.fillStyle=g;c.beginPath();c.arc(0,S*.02,S*.36,0,7);c.fill();
  c.fillStyle=aCol('#7a4e28',k);
  c.beginPath();c.ellipse(0,-S*.22,S*.16,S*.07,0,0,7);c.fill();
  c.restore();
  c.fillStyle=st;
  c.restore();
 },
 quietPhone(c,x,y,S,k){
  /* the body stays dark whatever happens, so this one comes back by
     lighting up rather than by changing colour */
  c.save();c.translate(x,y);
  if(k>.5){
   const g=c.createRadialGradient(0,0,0,0,0,S*1.5);
   g.addColorStop(0,`rgba(255,170,205,${.42*(k-.5)/.5})`);
   g.addColorStop(1,'rgba(255,170,205,0)');
   c.fillStyle=g;c.beginPath();c.arc(0,0,S*1.5,0,7);c.fill();
  }
  c.fillStyle=aCol('#3b2b3e',Math.min(1,k+.25));
  aRR(c,-S*.34,-S*.72,S*.68,S*1.44,S*.12);c.fill();
  c.fillStyle=k>.5?'#ffe9f3':aCol('#4e4152',k);
  aRR(c,-S*.28,-S*.65,S*.56,S*1.28,S*.08);c.fill();
  c.textAlign='center';c.textBaseline='middle';
  if(k>.5){
   /* a call coming in, which is the thing that never happened */
   c.fillStyle='#d4467c';
   c.font=`500 ${Math.max(7,S*.15)}px Lora,Georgia,serif`;
   c.fillText('20:45',0,-S*.30);
   c.strokeStyle='#e8729a';c.lineWidth=Math.max(1.4,S*.035);c.lineCap='round';
   for(let i=-3;i<=3;i++){
    const hgt=S*.30*(.3+.7*Math.abs(Math.sin(i*1.1)))*(1-Math.abs(i)/4.4);
    c.beginPath();c.moveTo(i*S*.075,-hgt/2+S*.08);c.lineTo(i*S*.075,hgt/2+S*.08);c.stroke();
   }
  }else{
   c.fillStyle=aCol('#9c8fa6',Math.max(k,.30));
   c.font=`500 ${Math.max(8,S*.18)}px 'IBM Plex Mono',ui-monospace,monospace`;
   c.fillText('20:45',0,-S*.16);
  }
  c.restore();
 },

 /* ---------- state ---------- */
 init(A,W,H){
  const caps=AL(A.key,'captions');
  A.items=[
   {f:'corridor',     cap:caps[0]||''},
   {f:'seats',        cap:caps[1]||''},
   {f:'hanger',       cap:caps[2]||''},
   {f:'scooterAlone', cap:caps[3]||''},
   {f:'onePlate',     cap:caps[4]||''},
   {f:'quietPhone',   cap:caps[5]||''}
  ];
  /* where each one sits once everything gathers and she can reach them */
  const spots=[[.24,.30],[.72,.26],[.22,.55],[.76,.55],[.30,.80],[.72,.80]];
  A.items.forEach((it,i)=>{
   it.on=false;it.pop=0;
   it.gx=spots[i][0]*W;it.gy=spots[i][1]*H;
  });
  A.restored=0;A.asked=false;A.finished=0;A.ripples=[];
 },

 /* ---------- what she taps ---------- */
 tap(A,x,y,W,H){
  if(!A.gathered)return;
  const R=Math.min(W,H)*.17;
  for(const it of A.items){
   if(it.on)continue;
   if(Math.hypot(x-it.gx,y-it.gy)<R){
    it.on=true;A.restored++;
    A.ripples.push({x:it.gx,y:it.gy,t:0});
    try{AUDIO.fx(A.restored>=A.items.length?'win':'good')}catch(e){}
    if(A.restored>=A.items.length)A.finished=performance.now();
    return;
   }
  }
 },

 draw(A,c,W,H,t,P,pal){
  if(!A.items)return;
  const S=Math.min(W,H);
  const drain  =aSeg(P,.05,.17);            // colour leaving
  const tour   =aSeg(P,.17,.88);            // the empty year
  const gather =aSeg(P,.88,1);              // everything comes to her

  /* how much colour is in the world right now */
  const back=A.restored/A.items.length;
  const k=Math.max(1-drain, back);
  A.bgA=aCol(pal.a,k*.95);
  A.bgB=aCol(pal.b,k*.95);
  A.gathered=gather>=1;

  c.textAlign='center';c.textBaseline='middle';

  /* ---- the line that starts it ---- */
  if(P<.20){
   const a=aSeg(P,.01,.06)*(1-aSeg(P,.15,.20));
   if(a>0){
    c.globalAlpha=a;
    aGlowText(c,pal.dark||k<.55);
    c.font=`500 ${Math.max(15,S*.050)}px 'Playfair Display',Georgia,serif`;
    aWrap(c,AT(A.key,'open'),W*.78).forEach((ln,i,arr)=>
     c.fillText(ln,W/2,H*.46+(i-(arr.length-1)/2)*S*.070));
    aClearShadow(c);c.globalAlpha=1;
   }
  }

  /* ---- the tour of the year that didn't happen ---- */
  if(tour>0&&gather<1){
   const n=A.items.length;
   const slot=1/n, pos=tour*n;
   for(let i=0;i<n;i++){
    const local=pos-i;
    if(local<=-.18||local>=1.18)continue;
    const fade=Math.min(aEase(Math.min(1,(local+.18)/.34)),
                        aEase(Math.min(1,(1.18-local)/.34)));
    if(fade<=0)continue;
    /* a slow drift, so it reads as moving through rather than flicking past */
    const dx=(local-.5)*S*.16;
    c.globalAlpha=fade;
    const it=A.items[i];
    this[it.f](c,W/2+dx,H*.44,S*.26,0);
    if(it.cap){
     c.fillStyle='rgba(180,170,190,.85)';
     c.font=`italic ${Math.max(13,S*.042)}px Lora,Georgia,serif`;
     aWrap(c,it.cap,W*.74).forEach((ln,j,arr)=>
      c.fillText(ln,W/2+dx*.5,H*.78+(j-(arr.length-1)/2)*S*.055));
    }
    c.globalAlpha=1;
   }
  }

  /* ---- everything gathers, and she is asked ---- */
  if(gather>0){
   const e=aEase(gather);
   A.items.forEach((it,i)=>{
    /* each one flies from the middle out to its own place */
    const fx=aLerp(W/2,it.gx,e), fy=aLerp(H*.44,it.gy,e);
    const sz=aLerp(S*.26,S*.115,e);
    if(it.on&&it.pop<1)it.pop=Math.min(1,it.pop+.06);
    const pop=1+Math.sin(it.pop*Math.PI)*.22;
    c.save();
    if(!it.on&&A.gathered){
     /* the ones still grey breathe, so it's obvious they're waiting */
     const b=1+Math.sin(t*1.7+i)*.035;
     c.translate(fx,fy);c.scale(b,b);c.translate(-fx,-fy);
    }
    this[it.f](c,fx,fy,sz*pop,it.on?1:0);
    c.restore();
   });

   /* ripples where she touched */
   A.ripples.forEach(r=>{
    r.t+=1/60;const rr=r.t*S*.55,a=Math.max(0,.5-r.t*.55);
    if(a<=0)return;
    c.strokeStyle=`rgba(244,160,188,${a})`;c.lineWidth=2;
    c.beginPath();c.arc(r.x,r.y,rr,0,7);c.stroke();
   });
   A.ripples=A.ripples.filter(r=>r.t<1);

   /* the instruction, then the closing lines */
   if(A.restored<A.items.length){
    c.globalAlpha=aEase(gather);
    aGlowText(c,pal.dark||back<.55);
    c.font=`600 ${Math.max(16,S*.055)}px 'Playfair Display',Georgia,serif`;
    c.fillText(AT(A.key,'ask'),W/2,H*.075);
    if(A.restored>0){
     c.font=`400 ${Math.max(11,S*.034)}px 'IBM Plex Mono',ui-monospace,monospace`;
     c.globalAlpha=aEase(gather)*.75;
     c.fillText(A.restored+' of '+A.items.length,W/2,H*.128);
    }
    aClearShadow(c);c.globalAlpha=1;
   }else{
    const since=(performance.now()-A.finished)/1000;
    const a=Math.min(1,since/1.1);
    c.globalAlpha=a;
    aGlowText(c,pal.dark);
    c.font=`500 ${Math.max(14,S*.046)}px 'Playfair Display',Georgia,serif`;
    /* clear of the skip button in the corner */
    const lines=AL(A.key,'close');
    let ly=H*.11;
    lines.forEach(ln=>{
     aWrap(c,ln,W*.74).forEach(w=>{c.fillText(w,W/2,ly);ly+=S*.058});
     ly+=S*.022;
    });
    aClearShadow(c);c.globalAlpha=1;
    /* let her sit in it for a moment, then hand over to the note */
    if(since>4.2&&A.hold)A.release();
   }
  }
 },

 mark(c,s){
  c.fillStyle='#8d7a93';aRR(c,s*.30,s*.16,s*.40,s*.68,s*.04);c.fill();
  c.fillStyle='#f4a0bc';aRR(c,s*.38,s*.26,s*.24,s*.48,s*.03);c.fill();
 }
};

/* ================= three he already described =================
   The worm line he saved for a normal day, the haircut she is permanently
   furious about, and the ride home from the internship. Nothing invented:
   each one is a thing he told me, drawn.                                  */

/* ---------------------------------------------------------------- 1 · the worm
   A one-joke scene, and the joke has to turn at the end or it is just a pun.
   The bird is not early because it wants to eat her. It is early because it
   wants to be there first. That is the whole animation.                      */
ASCENES.worm={
 name:'If you were a worm',grp:'Ours',dur:34,
 blurb:'The earliest bird. Waiting since before dawn, and not for the reason you think.',
 solo:true,
 /* [arrives, leaves] -- against the dark, the dawn, and the ones who turn
    up at a reasonable hour */
 cues:[[.03,.13],[.15,.26],[.42,.545],[.62,.73],[.79,2]],
 def:{
  words:['If you were a worm, I’d be the earliest bird.',
         'Out here since three, in the dark, for no sensible reason.',
         'The others turn up at a normal hour. I don’t rate them.',
         'And no — not to eat you.',
         'Just so that when you finally came up, I was already there.']
 },
 fields:[{f:'words',l:'The lines that float over it',h:'One per line.'}],

 init(A,W,H,R){
  A.bgA='#14203a';A.bgB='#2a2b4e';
  A.stars=[];for(let i=0;i<40;i++)A.stars.push({x:R(),y:R()*.55,r:.6+R()*1.3,tw:R()*6.3});
 },

 bird(c,x,y,s,t,who,a){
  if(a<=0)return;
  c.save();c.globalAlpha=a;c.translate(x,y);c.scale(s,s);
  const bob=Math.sin(t*1.6+x*.05)*.7;
  c.translate(0,bob);
  const body=who==='me'?'#6d86c9':'#a9a3b8';
  /* legs */
  c.strokeStyle='#d99a54';c.lineWidth=1.6;c.lineCap='round';
  c.beginPath();c.moveTo(-2.5,7);c.lineTo(-2.5,11);c.stroke();
  c.beginPath();c.moveTo(2.5,7);c.lineTo(2.5,11);c.stroke();
  /* body and the tail */
  c.fillStyle=body;
  c.beginPath();c.ellipse(0,2,8,7.5,0,0,7);c.fill();
  c.beginPath();c.moveTo(6,0);c.lineTo(14,-4);c.lineTo(7,4);c.closePath();c.fill();
  /* head */
  c.beginPath();c.arc(-4,-6,5.4,0,7);c.fill();
  c.fillStyle='#e8a961';
  c.beginPath();c.moveTo(-9,-6);c.lineTo(-15,-4.6);c.lineTo(-9,-3);c.closePath();c.fill();
  c.fillStyle='#1d1a26';
  c.beginPath();c.arc(-5.4,-7.2,1.15,0,7);c.fill();
  c.restore();
 },
 /* he has been here so long he brought a clock */
 alarm(c,x,y,s,a,t){
  if(a<=0)return;
  c.save();c.globalAlpha=a;c.translate(x,y);c.scale(s,s);
  c.fillStyle='#c9536b';
  c.beginPath();c.arc(-4.6,-6.4,2.4,0,7);c.fill();
  c.beginPath();c.arc(4.6,-6.4,2.4,0,7);c.fill();
  c.fillStyle='#e8e2ea';c.beginPath();c.arc(0,0,7,0,7);c.fill();
  c.strokeStyle='#4b4450';c.lineWidth=1.1;c.beginPath();c.arc(0,0,7,0,7);c.stroke();
  /* stuck at three in the morning, which is the joke */
  c.lineWidth=1.3;c.lineCap='round';
  c.beginPath();c.moveTo(0,0);c.lineTo(3.4,0);c.stroke();
  c.beginPath();c.moveTo(0,0);c.lineTo(0,-4.6);c.stroke();
  /* and it rings, because of course it does */
  const ring=Math.sin(t*9)>0?1:0;
  if(ring){
   c.strokeStyle='#e8c07a';c.lineWidth=1;
   [[-9,-9],[9,-9]].forEach(([bx,by])=>{
    c.beginPath();c.arc(bx,by,3.2,0,Math.PI*1.4);c.stroke();
   });
  }
  c.restore();
 },
 ground(c,W,H,y,dawn){
  c.fillStyle=aMix('#2d2338','#5c4436',dawn);
  c.fillRect(0,y,W,H-y);
  c.fillStyle=aMix('#3a2c45','#6d5140',dawn);
  c.beginPath();c.ellipse(W*.5,y,W*.6,H*.035,0,0,7);c.fill();
 },
 /* she comes up out of the soil, unhurried, in her own time */
 worm(c,x,y,s,t,up){
  if(up<=0)return;
  c.save();c.translate(x,y);c.scale(s,s);
  const h=aEase(up)*15;
  c.strokeStyle='#e08a9c';c.lineWidth=5.2;c.lineCap='round';
  c.beginPath();
  c.moveTo(0,2);
  c.quadraticCurveTo(Math.sin(t*1.4)*3.5,2-h*.6,Math.sin(t*1.4)*2.2,2-h);
  c.stroke();
  if(up>.55){
   c.fillStyle='#2b1f28';
   const ey=2-h, ex=Math.sin(t*1.4)*2.2;
   c.beginPath();c.arc(ex-1.3,ey-.6,.75,0,7);c.fill();
   c.beginPath();c.arc(ex+1.3,ey-.6,.75,0,7);c.fill();
  }
  c.restore();
 },

 draw(A,c,W,H,t,P){
  const S=Math.min(W,H), gy=H*.50;
  const dawn=aSeg(P,.29,.55);
  A.bgA=aMix('#14203a','#ffd9a8',dawn);
  A.bgB=aMix('#2a2b4e','#f5a9a0',dawn);

  /* the stars go out as it gets light */
  const sa=1-dawn;
  if(sa>0)A.stars.forEach(s=>{
   c.globalAlpha=sa*(.35+.65*(Math.sin(t*1.4+s.tw)*.5+.5));
   c.fillStyle='#fff';
   c.beginPath();c.arc(s.x*W,s.y*gy,s.r,0,7);c.fill();
  });
  c.globalAlpha=1;

  /* the sun, eventually */
  if(dawn>0){
   const sy=aLerp(gy+S*.10,gy-S*.10,dawn);
   const g=c.createRadialGradient(W*.78,sy,0,W*.78,sy,S*.30);
   g.addColorStop(0,`rgba(255,220,150,${.75*dawn})`);
   g.addColorStop(1,'rgba(255,220,150,0)');
   c.fillStyle=g;c.beginPath();c.arc(W*.78,sy,S*.30,0,7);c.fill();
   c.fillStyle=`rgba(255,236,190,${dawn})`;
   c.beginPath();c.arc(W*.78,sy,S*.048,0,7);c.fill();
  }

  this.ground(c,W,H,gy,dawn);

  /* him, already there, since long before any of this */
  this.bird(c,W*.435,gy-S*.035,S*.0130,t,'me',1);
  this.alarm(c,W*.545,gy-S*.010,S*.0072,1-aSeg(P,.58,.70),t);

  /* the reasonable birds, arriving at a reasonable hour */
  const late=aSeg(P,.43,.56);
  for(let i=0;i<3;i++){
   const a=Math.min(1,Math.max(0,late*3-i));
   this.bird(c,W*(.635+i*.125),gy-S*.026,S*.0112,t,'them',a);
  }

  /* and her, coming up when she is ready and not before */
  this.worm(c,W*.195,gy-S*.005,S*.0105,t,aSeg(P,.66,.84));
 },

 mark(c,s){
  c.strokeStyle='#e08a9c';c.lineWidth=s*.075;c.lineCap='round';
  c.beginPath();c.moveTo(s*.28,s*.72);
  c.quadraticCurveTo(s*.20,s*.50,s*.29,s*.36);c.stroke();
  c.fillStyle='#6d86c9';
  c.beginPath();c.ellipse(s*.62,s*.60,s*.16,s*.145,0,0,7);c.fill();
  c.beginPath();c.arc(s*.50,s*.45,s*.105,0,7);c.fill();
  c.fillStyle='#e8a961';
  c.beginPath();c.moveTo(s*.41,s*.45);c.lineTo(s*.30,s*.48);c.lineTo(s*.41,s*.51);c.closePath();c.fill();
 }
};


/* ------------------------------------------------------------ 2 · the haircut

   love the most and who does not listen to you at all. It is him. It is

ASCENES.haircut={
 name:'The haircut',grp:'Ours',dur:40,
 blurb:'He cuts it short. She is furious. He does it again.',
 light:true,   /* pale ground: dark letters, pale scrim */
 solo:true,

 },
 fields:[{f:'words',l:'The lines that float over it',h:'One per line.'}],

 init(A,W,H,R){
  A.bgA='#f6e4d8';A.bgB='#e8b9c6';
  A.snip=[];for(let i=0;i<20;i++)A.snip.push({x:(R()-.5),d:R(),sp:.5+R()*.9,r:R()*6.3});
 },

 /* him, without the cap for once -- the cap is the reason you never see the
    hair in any of the other scenes, and this scene is entirely about the hair.
    hair: 1 is how she likes it, 0 is what he keeps doing to it. */
 guy(c,x,y,s,hair,happy){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='#5c6b9c';
  c.beginPath();
  c.moveTo(-14,34);c.quadraticCurveTo(-16,2,-9,-6);
  c.lineTo(9,-6);c.quadraticCurveTo(16,2,14,34);
  c.closePath();c.fill();
  c.strokeStyle='#5c6b9c';c.lineWidth=7;c.lineCap='round';
  c.beginPath();c.moveTo(-10,2);c.lineTo(-16,20);c.stroke();
  c.beginPath();c.moveTo(10,2);c.lineTo(16,20);c.stroke();
  c.fillStyle='#c08a63';
  c.beginPath();c.arc(0,-20,13,0,7);c.fill();
  /* what is left of it */
  if(hair>.04){
   /* the amount has to change the SHAPE, not just nudge it: a full head sits
      proud of the skull, a buzz cut sits inside it */
   const r=11.4+hair*2.9, ry=-20.4-hair*2.4;
   c.fillStyle='#2f2129';
   c.beginPath();c.arc(0,ry,r,Math.PI,0);c.fill();
   c.fillRect(-r,ry-.6,r*2,1.2+hair*6.8);
  }else{
   c.fillStyle='rgba(47,33,41,.20)';
   c.beginPath();c.arc(0,-21,13.2,Math.PI,0);c.fill();
  }
  c.fillStyle='#1d1a26';
  c.beginPath();c.arc(-4.5,-20,1.7,0,7);c.fill();
  c.beginPath();c.arc(4.5,-20,1.7,0,7);c.fill();
  c.strokeStyle='#1d1a26';c.lineWidth=1.6;c.lineCap='round';
  c.beginPath();
  if(happy)c.arc(0,-16,5.5,.25,Math.PI-.25);
  else{c.moveTo(-4.5,-13.6);c.quadraticCurveTo(0,-15.6,4.5,-13.6)}
  c.stroke();
  c.restore();
 },
 /* her, arms folded, saying nothing, which is worse */
 girl(c,x,y,s,t){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='#e8729a';
  c.beginPath();
  c.moveTo(-14,34);c.quadraticCurveTo(-16,2,-9,-6);
  c.lineTo(9,-6);c.quadraticCurveTo(16,2,14,34);
  c.closePath();c.fill();
  /* folded, not hanging */
  c.strokeStyle='#d2traits';c.strokeStyle='#d2648d';c.lineWidth=6.4;c.lineCap='round';
  c.beginPath();c.moveTo(-12,5);c.lineTo(11,2);c.stroke();
  c.beginPath();c.moveTo(-11,10);c.lineTo(12,7);c.stroke();
  c.fillStyle='#d9a583';
  c.beginPath();c.arc(0,-20,13,0,7);c.fill();
  c.fillStyle='#2f2129';
  c.beginPath();c.arc(0,-22,14,Math.PI,0);c.fill();
  c.beginPath();c.ellipse(-13,-14,5,12,.2,0,7);c.fill();
  c.beginPath();c.ellipse(13,-14,5,12,-.2,0,7);c.fill();
  c.fillStyle='#1d1a26';
  c.beginPath();c.arc(-4.5,-20,1.7,0,7);c.fill();
  c.beginPath();c.arc(4.5,-20,1.7,0,7);c.fill();
  c.strokeStyle='#1d1a26';c.lineWidth=1.6;c.lineCap='round';
  c.beginPath();c.arc(0,-9,5.2,Math.PI*1.18,Math.PI*1.82);c.stroke();

 },
 /* one small cloud, well clear of her head, entirely for him */
 cloud(c,x,y,s,a,t){
  if(a<=0)return;
  c.save();c.globalAlpha=a;
  const bob=Math.sin(t*1.5)*s*.9;
  c.fillStyle='#7d6a92';
  [[-10,0,8.5],[0,-4,11],[10,0,8]].forEach(([dx,dy,r])=>{
   c.beginPath();c.arc(x+s*dx,y+s*dy+bob,s*r,0,7);c.fill();
  });
  c.fillStyle='#6a5980';
  aRR(c,x-s*15,y+bob,s*30,s*5,s*2.5);c.fill();
  c.strokeStyle='#8f7fc2';c.lineWidth=s*1.9;c.lineCap='round';
  [-8,0,8].forEach((dx,i)=>{
   const d=(t*1.5+i*.33)%1;
   c.globalAlpha=a*(1-d)*.9;
   c.beginPath();
   c.moveTo(x+s*dx,y+s*6+bob+d*s*11);
   c.lineTo(x+s*(dx-2),y+s*11+bob+d*s*11);
   c.stroke();
  });
  c.restore();
 },
 scissors(c,x,y,s,open,a){
  if(a<=0)return;
  c.save();c.globalAlpha=a;c.translate(x,y);c.scale(s,s);c.rotate(-.35);
  c.strokeStyle='#6e7a89';c.lineWidth=2.1;c.lineCap='round';
  [1,-1].forEach(d=>{
   c.beginPath();c.moveTo(11,d*(1+open*2.6));c.lineTo(-5,d*.4);c.stroke();
   c.beginPath();c.arc(-9,d*(2.4+open*3),3,0,7);c.stroke();
  });
  c.restore();
 },

 draw(A,c,W,H,t,P){
  const S=Math.min(W,H), base=H*.40, fs=S*.0056;
  const cut  = aSeg(P,.20,.27);
  const proud= aSeg(P,.27,.35);
  const her  = aSeg(P,.40,.46);
  const again= aSeg(P,.78,.90);          /* and he does it again anyway */

  /* it grows back a little, and then he cuts it again */
  const hair = aLerp(1,0,cut)*(1-aSeg(P,.64,.76)) + aSeg(P,.64,.76)*aLerp(.45,0,again);
  const busy = Math.max(cut<1?cut:0, again>0&&again<1?1:0);
  const hx   = aLerp(W*.50,W*.33,her);

  /* the hair on the floor */
  if(busy>0){
   A.snip.forEach(p=>{
    const u=((t*p.sp*.55+p.d)%1);
    c.globalAlpha=busy*(1-u)*.8;
    c.fillStyle='#2f2129';
    c.save();
    c.translate(hx+p.x*S*.085, base-S*.115+u*S*.20);
    c.rotate(p.r+t*p.sp);
    c.fillRect(-S*.011,-S*.003,S*.022,S*.006);
    c.restore();
   });
   c.globalAlpha=1;
  }

  const bobM=Math.sin(t*.95)*S*.0035;
  this.guy(c,hx,base+bobM,fs,hair,proud>.4||again>.4);
  /* the scissors hover from the start -- waiting is part of the joke */
  const idle=Math.sin(t*1.1)*S*.006;
  /* clear of his head -- at the old offset the finger loops sat on his cheek */
  this.scissors(c,hx+S*.135+idle,base-S*.205+bobM,fs*1.5,
                busy>0?Math.abs(Math.sin(t*6)):.25+.25*Math.sin(t*1.4),
                Math.max(busy,.45));

  if(her>0){
   c.globalAlpha=her;
   this.girl(c,W*.68,base+Math.sin(t*.8+2)*S*.0035,fs,t);
   c.globalAlpha=1;
   this.cloud(c,W*.68,base-S*.225,fs*.62,her,t);
  }
 },

 mark(c,s){
  c.fillStyle='#c08a63';
  c.beginPath();c.arc(s*.46,s*.60,s*.27,0,7);c.fill();
  c.fillStyle='rgba(47,33,41,.24)';
  c.beginPath();c.arc(s*.46,s*.58,s*.273,Math.PI,0);c.fill();
  c.strokeStyle='#6e7a89';c.lineWidth=s*.05;c.lineCap='round';
  c.beginPath();c.moveTo(s*.62,s*.16);c.lineTo(s*.90,s*.38);c.stroke();
  c.beginPath();c.moveTo(s*.62,s*.38);c.lineTo(s*.90,s*.16);c.stroke();
  c.beginPath();c.arc(s*.58,s*.20,s*.055,0,7);c.stroke();
  c.beginPath();c.arc(s*.58,s*.34,s*.055,0,7);c.stroke();
 }
};


/* --------------------------------------------------------- 3 · the ride home
   Six o'clock, every evening of the internship. It rhymes on purpose with
   Before and with 22 April: a seat that is empty, and then isn't.         */
ASCENES.ride={
 name:'The ride home',grp:'Ours',dur:40,
 blurb:'Six o’clock, the scooter, and the seat behind him that stopped being empty.',
 solo:true,
 /* [arrives, leaves] -- waiting, getting on, rolling, and the two months */
 cues:[[.03,.16],[.24,.355],[.42,.53],[.58,.70],[.76,2]],
 def:{
  words:['Six o’clock. Same gate, same scooter, same twenty minutes.',
         'It wasn’t the first day. It took a while to become every day.',
         'And then you never asked again — you just got on.',
         'Two months of taking you home.',
         'Still the best part of that whole job.']
 },
 fields:[{f:'words',l:'The lines that float over it',h:'One per line.'}],

 init(A,W,H,R){
  A.bgA='#ffb07a';A.bgB='#6b4a72';
  A.lamp=[];for(let i=0;i<7;i++)A.lamp.push({x:i/7});
  A.dust=[];for(let i=0;i<18;i++)A.dust.push({x:R(),y:R(),sp:.4+R()*1.2});
 },

 scoot(c,x,y,s,t,roll,rider2){
  c.save();c.translate(x,y);c.scale(s,s);
  const wob=Math.sin(t*9)*(roll?.5:0);
  c.translate(0,wob);
  /* wheels */
  c.fillStyle='#2b2630';
  [[-18,0],[18,0]].forEach(([wx])=>{
   c.beginPath();c.arc(wx,0,8.2,0,7);c.fill();
   c.fillStyle='#8d8797';c.beginPath();c.arc(wx,0,3.4,0,7);c.fill();
   c.fillStyle='#2b2630';
  });
  /* body */
  c.fillStyle='#4a6fa5';
  c.beginPath();
  c.moveTo(-18,-3);c.quadraticCurveTo(-13,-13,-4,-13);
  c.lineTo(11,-13);c.quadraticCurveTo(19,-11,18,-3);
  c.quadraticCurveTo(4,2,-18,-3);c.closePath();c.fill();
  /* the long seat: his bit, and the bit behind it */
  c.fillStyle='#2f2b36';
  aRR(c,-15,-19,17,6,3);c.fill();
  c.fillStyle=rider2?'#2f2b36':'#413c4a';
  aRR(c,1,-20,15,6,3);c.fill();
  /* handlebar and the light */
  c.strokeStyle='#3b3644';c.lineWidth=2.6;c.lineCap='round';
  c.beginPath();c.moveTo(13,-13);c.lineTo(19,-25);c.lineTo(26,-25);c.stroke();
  c.fillStyle='#ffe0a8';
  c.beginPath();c.arc(22,-19,3,0,7);c.fill();
  c.restore();
 },
 rider(c,x,y,s,who,t,hold,opt){
  c.save();c.translate(x,y);
  /* scenes that borrow this need the face too -- he is not always pleased */
  pdFig(c,0,0,s,who,opt||{});
  if(hold){
   /* she holds on, which took her a while to start doing */
   c.strokeStyle='#e8729a';c.lineWidth=s*6.5;c.lineCap='round';
   c.beginPath();c.moveTo(-s*9,s*2);c.lineTo(-s*24,s*4);c.stroke();
  }
  c.restore();
 },
 street(c,W,H,y,t,roll,A){
  /* the lamps live in the band just above the road, not up the whole sky */
  const s=Math.min(W,H);
  A.lamp.forEach(p=>{
   const u=((p.x - t*roll*.16)%1+1)%1;
   const lx=u*W*1.25-W*.12, top=y-s*.30;
   c.strokeStyle='rgba(52,42,62,.95)';c.lineWidth=s*.010;c.lineCap='round';
   c.beginPath();c.moveTo(lx,y);c.lineTo(lx,top);c.stroke();
   c.beginPath();c.moveTo(lx,top);c.quadraticCurveTo(lx+s*.035,top-s*.012,lx+s*.055,top);c.stroke();
   c.fillStyle='#ffe0a8';
   c.beginPath();c.ellipse(lx+s*.055,top+s*.006,s*.016,s*.010,0,0,7);c.fill();
   const g=c.createRadialGradient(lx+s*.055,top,0,lx+s*.055,top,s*.20);
   g.addColorStop(0,'rgba(255,214,150,.26)');
   g.addColorStop(1,'rgba(255,214,150,0)');
   c.fillStyle=g;c.beginPath();c.arc(lx+s*.055,top,s*.20,0,7);c.fill();
  });
  /* the road itself, and the dashes that carry the speed */
  c.fillStyle='#3a2f45';c.fillRect(0,y,W,H-y);
  c.strokeStyle='rgba(255,236,200,.45)';c.lineWidth=s*.008;
  c.setLineDash([s*.055,s*.065]);
  c.lineDashOffset=-(t*roll*s*.66)%(s*.12);
  c.beginPath();c.moveTo(0,y+(H-y)*.30);c.lineTo(W,y+(H-y)*.30);c.stroke();
  c.setLineDash([]);
 },

 draw(A,c,W,H,t,P){
  const S=Math.min(W,H), gy=H*.40;
  const ss=S*.0088, rr=S*.0047;          /* a scooter, and people the size of people */
  const wait  = 1-aSeg(P,.22,.33);
  const onNow = aSeg(P,.25,.36);
  const roll  = aSeg(P,.42,.55);
  const hold  = aSeg(P,.58,.70);

  this.street(c,W,H,gy,t,roll,A);

  /* the office gate, only while he is still waiting outside it */
  if(wait>0){
   c.globalAlpha=wait;
   c.fillStyle='#4b3b52';
   aRR(c,W*.015,gy-S*.30,W*.17,S*.30,S*.008);c.fill();
   c.fillStyle='#ffe0a8';
   aRR(c,W*.05,gy-S*.24,W*.048,S*.075,S*.006);c.fill();
   c.globalAlpha=1;
  }

  /* even standing still it ticks over, and he shifts about waiting */
  const idle=(1-roll)*Math.sin(t*7.5)*S*.0022 + Math.sin(t*.9)*S*.003;
  const sx=W*.50, sy=gy+S*.075+idle;
  const seatY=sy-19*ss;                  /* where a person actually sits */
  this.scoot(c,sx,sy,ss,t,roll,onNow>.5);
  this.rider(c,sx-7*ss, seatY-23*rr, rr,'m',t,false);
  if(onNow>0){
   const u=aEase(onNow);
   const ex=aLerp(W*.12, sx+9*ss, u);
   const ey=aLerp(gy+S*.03, seatY-24*rr, u);
   c.globalAlpha=Math.min(1,onNow*2.4);
   this.rider(c,ex,ey,rr,'z',t,hold>.4&&onNow>.92);
   c.globalAlpha=1;
  }

  /* road dust, so the bottom of the frame is never dead */
  if(roll>0)A.dust.forEach(p=>{
   const u=((p.x - t*p.sp*.30)%1+1)%1;
   c.globalAlpha=roll*.16;
   c.fillStyle='#d8c3b0';
   c.beginPath();c.arc(u*W, gy+S*.13+p.y*S*.07, S*.005,0,7);c.fill();
  });
  c.globalAlpha=1;
 },

 mark(c,s){
  c.fillStyle='#4a6fa5';
  c.beginPath();
  c.moveTo(s*.18,s*.60);c.quadraticCurveTo(s*.26,s*.44,s*.39,s*.44);
  c.lineTo(s*.62,s*.44);c.quadraticCurveTo(s*.76,s*.48,s*.76,s*.60);
  c.closePath();c.fill();
  c.fillStyle='#2b2630';
  c.beginPath();c.arc(s*.28,s*.66,s*.105,0,7);c.fill();
  c.beginPath();c.arc(s*.68,s*.66,s*.105,0,7);c.fill();
  c.fillStyle='#5c6b9c';
  c.beginPath();c.arc(s*.41,s*.31,s*.077,0,7);c.fill();
  c.fillStyle='#e8729a';
  c.beginPath();c.arc(s*.57,s*.31,s*.077,0,7);c.fill();
 }
};

/* ---------- grain and tearing: what makes it feel like somewhere else ---------- */
let NOISE=null;
function makeNoise(){
 const n=document.createElement('canvas');n.width=n.height=128;
 const x=n.getContext('2d'),d=x.createImageData(128,128);
 for(let i=0;i<d.data.length;i+=4){
  const v=Math.random()*255;
  d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=26;
 }
 x.putImageData(d,0,0);NOISE=n;
}
function grain(a){
 if(!NOISE)makeNoise();
 C.save();C.globalAlpha=a;
 const ox=-Math.random()*128, oy=-Math.random()*128;
 for(let gx=ox;gx<W;gx+=128)for(let gy=oy;gy<H;gy+=128)C.drawImage(NOISE,gx,gy);
 C.restore();
}
function scanlines(a){
 C.save();C.globalAlpha=a;C.fillStyle='#000';
 for(let y=0;y<H;y+=3)C.fillRect(0,y,W,1);
 C.restore();
}
/* slice the canvas and shove the slices sideways */
function tear(strength,slices){
 C.save();C.setTransform(1,0,0,1,0,0);
 const n=slices||(4+Math.floor(strength*12));
 for(let i=0;i<n;i++){
  const sy=Math.random()*CV.height;
  const sh=(4+Math.random()*30*strength)*DPR;
  const dx=(Math.random()-.5)*CV.width*.30*strength;
  C.drawImage(CV,0,sy,CV.width,sh,dx,sy,CV.width,sh);
 }
 C.restore();
}
/* pull the channels apart a little */
function chromaSplit(px){
 C.save();C.setTransform(1,0,0,1,0,0);
 C.globalCompositeOperation='lighter';C.globalAlpha=.35;
 C.drawImage(CV,-px*DPR,0);
 C.drawImage(CV, px*DPR,0);
 C.restore();
}

function drawObj(name,x,y,s,k){
 const fn=PD_OBJ[name];
 if(fn)return fn(C,x,y,s,k);
 const sc=ASCENES.parallel;
 if(sc&&typeof sc[name]==='function')return sc[name](C,x,y,s,k);
 if(name==='band'){
  C.strokeStyle=aCol('#241d26',k);C.lineWidth=Math.max(3,s*.16);
  C.beginPath();C.ellipse(x,y,s*.42,s*.26,.25,0,7);C.stroke();return;
 }
 C.fillStyle=aCol('#8d7a93',k);C.beginPath();C.arc(x,y,s*.4,0,7);C.fill();
}

function size(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=CV.clientWidth;H=CV.clientHeight;
 CV.width=W*DPR;CV.height=H*DPR;C.setTransform(DPR,0,0,DPR,0,0);
}

/* colour in the world: full before the tear, none after, back at the end */
function colourK(){
 const p=ST.phase;
 if(p==='normal'||p==='warn'||p==='ask'||p==='force')return 1;
 if(p==='tear')return Math.max(0,1-ST.pt/1.1);
 if(p==='bloom')return aEase(Math.min(1,ST.bloomT/2.4));
 return (p==='joy'||p==='letter')?1:0;
}
const inOther=()=>['chapter','after','reverse'].includes(ST.phase);

function paintChrome(){
 const k=colourK();
 document.body.dataset.dead=k<.6?'1':'0';
 /* the clock itself gets it wrong in there */
 let clock='27 days · 4 hrs · 11 min';
 if(k<.6){
  clock='— —   — —   — —';
  if(Math.random()<.03)clock='8 8 : 8 8 : 8 8';
 }
 $('#pclock').textContent=clock;
 $('#ptitle').textContent = k>=.6 ? '30 days · for Zahabiya' : '30 days · for ————————';

 const g=$('#pgarden'), gc=g.getContext('2d');
 if(g.width!==g.clientWidth*DPR){g.width=g.clientWidth*DPR;g.height=g.clientHeight*DPR}
 gc.setTransform(DPR,0,0,DPR,0,0);
 const gw=g.clientWidth, gh=g.clientHeight;
 gc.clearRect(0,0,gw,gh);
 const soil=gh-10;
 const sg=gc.createLinearGradient(0,soil-16,0,gh);
 sg.addColorStop(0,'rgba(120,120,124,0)');
 sg.addColorStop(1,k>=.6?'rgba(170,128,155,.55)':'rgba(104,104,110,.55)');
 gc.fillStyle=sg;gc.fillRect(0,soil-16,gw,gh-soil+16);
 for(let i=0;i<6;i++){
  const x=(.10+.80*(i/5))*gw;
  const grow=Math.max(0,Math.min(1,(k*7-i)));
  if(grow<=0){
   gc.strokeStyle='rgba(150,150,154,.45)';gc.lineWidth=1;
   gc.beginPath();gc.moveTo(x-5,soil);gc.lineTo(x+5,soil);gc.stroke();
   continue;
  }
  const top=soil-(gh*.60)*grow;
  gc.strokeStyle='rgba(111,163,122,.95)';gc.lineWidth=1.6+1.6*grow;gc.lineCap='round';
  gc.beginPath();gc.moveTo(x,soil);
  gc.quadraticCurveTo(x+(i%2?8:-8)*grow,(soil+top)/2,x,top);gc.stroke();
  if(grow>.75){
   const o=(grow-.75)/.25;
   gc.fillStyle=i%2?'#e8729a':'#f4a0bc';
   gc.beginPath();gc.arc(x,top,3+6*o,0,7);gc.fill();
  }
 }
}

function frame(n){
 if(!last)last=n;
 const dt=Math.min(.05,(n-last)/1000);last=n;T+=dt;
 const S2=Math.min(W,H);
 const k=colourK();

 const gr=C.createLinearGradient(0,0,0,H);
 gr.addColorStop(0,aCol('#3a2a5e',k));
 gr.addColorStop(1,aCol('#7a4a78',k));
 C.fillStyle=gr;C.fillRect(0,0,W,H);
 C.textAlign='center';C.textBaseline='middle';

 const P=ST.phase;
 if(P==='normal'||P==='warn'||P==='ask'||P==='force') drawOpen(S2,dt);
 else if(P==='tear')      drawTear(S2,dt);
 else if(P==='chapter')   drawChapter(S2,dt);
 else if(P==='after')     drawAfter(S2);
 else if(P==='reverse')   drawReverse(S2);
 else if(P==='bloom')     drawBloom(S2,dt);
 else if(P==='joy')       drawJoy(S2,dt);
 else                     drawLetter(S2,dt);

 /* the other place has grain in it, and now and then it slips */
 if(inOther()){
  grain(.55);scanlines(.055);
  if(Math.random()<.012)tear(.55);
 }

 paintChrome();
 raf=requestAnimationFrame(frame);
}

/* ---------- an ordinary morning, and then the question ---------- */
function drawOpen(S2,dt){
 ST.pt+=dt;
 const P=ST.phase;
 /* the envelope she expects */
 if(P==='normal'){
  const a=Math.min(1,ST.pt/.8);
  C.globalAlpha=a;
  C.fillStyle='#f4a0bc';
  aRR(C,W/2-S2*.28,H*.30,S2*.56,S2*.36,S2*.03);C.fill();
  C.fillStyle='rgba(255,255,255,.35)';
  C.beginPath();C.moveTo(W/2-S2*.28,H*.30);C.lineTo(W/2+S2*.28,H*.30);
  C.lineTo(W/2,H*.30+S2*.22);C.closePath();C.fill();
  aGlowText(C,true);
  C.font=`600 ${Math.max(13,S2*.040)}px 'IBM Plex Mono',ui-monospace,monospace`;
  C.fillText(PD_OPEN.day.toUpperCase(),W/2,H*.22);
  C.font=`400 ${Math.max(12,S2*.034)}px Lora,Georgia,serif`;
  C.globalAlpha=a*.8;
  C.fillText(PD_OPEN.date,W/2,H*.265);
  C.globalAlpha=a;
  C.font=`500 ${Math.max(15,S2*.050)}px 'Playfair Display',Georgia,serif`;
  C.fillText(PD_OPEN.normal,W/2,H*.76);
  aClearShadow(C);C.globalAlpha=1;
  if(ST.pt>3.4){ST.phase='warn';ST.pt=0}
  return;
 }
 /* the warning */
 if(P==='warn'){
  const a=Math.min(1,ST.pt/.9);
  C.globalAlpha=a;
  aGlowText(C,true);
  C.font=`400 ${Math.max(15,S2*.048)}px Lora,Georgia,serif`;
  let y=H*.42;
  PD_OPEN.warn.split('\n').forEach(ln=>{
   aWrap(C,ln,W*.78).forEach(w=>{C.fillText(w,W/2,y);y+=S2*.062});
   y+=S2*.020;
  });
  aClearShadow(C);C.globalAlpha=1;
  if(ST.pt>4.6){ST.phase='ask';ST.pt=0;$('#pchoice').hidden=false;paintBar()}
  return;
 }
 /* the question, with her two buttons under it */
 if(P==='ask'){
  const a=Math.min(1,ST.pt/.9);
  C.globalAlpha=a;
  aGlowText(C,true);
  C.font=`500 ${Math.max(17,S2*.055)}px 'Playfair Display',Georgia,serif`;
  let y=H*.36;
  PD_OPEN.ask.split('\n').forEach(ln=>{
   aWrap(C,ln,W*.80).forEach(w=>{C.fillText(w,W/2,y);y+=S2*.070});
  });
  aClearShadow(C);C.globalAlpha=1;
  return;
 }
 /* she said no. it happens anyway. */
 if(P==='force'){
  aGlowText(C,true);
  C.font=`500 ${Math.max(17,S2*.056)}px 'Playfair Display',Georgia,serif`;
  PD_OPEN.force.forEach((ln,i)=>{
   const st=i*1.5, a=Math.min(1,Math.max(0,(ST.pt-st)/.55));
   if(a<=0)return;
   C.globalAlpha=a;
   let fy=H*(.36+i*.11);
   aWrap(C,ln,W*.80).forEach(w=>{C.fillText(w,W/2,fy);fy+=S2*.062});
  });
  aClearShadow(C);C.globalAlpha=1;
  /* the screen starts misbehaving before it goes */
  if(ST.pt>2.2&&Math.random()<.25)tear(.4);
  if(ST.pt>PD_OPEN.force.length*1.5+1.4)toTear();
  return;
 }
}

/* ---------- being pulled through ---------- */
function drawTear(S2,dt){
 ST.pt+=dt;
 const p=ST.pt;
 /* whatever was on screen, coming apart */
 C.globalAlpha=Math.max(0,1-p/1.5);
 C.fillStyle='#f4a0bc';
 aRR(C,W/2-S2*.28,H*.30,S2*.56,S2*.36,S2*.03);C.fill();
 C.globalAlpha=1;
 if(p<1.5){tear(Math.min(1,p*1.1),10+Math.floor(p*22));chromaSplit(2+p*9)}
 if(p>=1.2&&p<1.5){C.fillStyle=`rgba(255,255,255,${(p-1.2)/.3})`;C.fillRect(0,0,W,H)}
 if(p>=1.5&&p<2.0){C.fillStyle=`rgba(0,0,0,${Math.min(1,(p-1.5)/.25)})`;C.fillRect(0,0,W,H)}
 if(p>=2.0&&p<2.9){
  C.fillStyle='#000';C.fillRect(0,0,W,H);
  const a=Math.min(1,(p-2.1)/.6);
  C.globalAlpha=a;
  aGlowText(C,true);
  C.font=`500 ${Math.max(12,S2*.036)}px 'IBM Plex Mono',ui-monospace,monospace`;
  C.fillText('22 APRIL 2026',W/2,H*.47);
  C.font=`400 ${Math.max(14,S2*.044)}px Lora,Georgia,serif`;
  C.fillText('You take the other internship.',W/2,H*.53);
  aClearShadow(C);C.globalAlpha=1;
  grain(.7);
 }
 if(p>=2.9){ST.phase='chapter';ST.chapter=0;ST.beat=0;ST.beatT=0;ST.flickerAt=T+2.4;paintBar()}
}
function toTear(){ST.phase='tear';ST.pt=0;$('#pchoice').hidden=true;paintBar()}

/* ---------- the empty year ---------- */
function drawChapter(S2,dt){
 const ch=PD_CHAPTERS[ST.chapter];
 ST.beatT+=dt;
 if(ST.beatT>BEAT){
  ST.beatT=0;ST.beat++;
  ST.flickerAt=T+1.6+Math.random()*3.4;
  if(ST.beat>=ch.beats.length){
   ST.phase='after';ST.beat=ch.beats.length-1;
   if(PD_VOICE.chapter===ch.id)ST.voiceT=T;
   paintBar();return;
  }
 }
 const b=ch.beats[ST.beat];
 const f=Math.min(aEase(Math.min(1,ST.beatT/.9)),
                  aEase(Math.min(1,(BEAT-ST.beatT)/.9)));
 let k=0;
 const since=T-ST.flickerAt;
 if(ST.flickerAt>0&&since>0&&since<.34)k=Math.sin(since/.34*Math.PI)*.92;

 C.globalAlpha=f;
 drawObj(b.o,W/2,H*.40,S2*.26,k);
 if(b.date){
  C.globalAlpha=f*.85;
  aGlowText(C,true);
  C.font=`500 ${Math.max(11,S2*.034)}px 'IBM Plex Mono',ui-monospace,monospace`;
  C.fillText(b.date.toUpperCase(),W/2,H*.665);
  aClearShadow(C);C.globalAlpha=f;
 }
 if(b.cap){
  aGlowText(C,true);
  C.font=`italic ${Math.max(13,S2*.043)}px Lora,Georgia,serif`;
  aWrap(C,b.cap,W*.80).forEach((ln,j,arr)=>
   C.fillText(ln,W/2,H*.75+(j-(arr.length-1)/2)*S2*.055));
  aClearShadow(C);
 }
 C.globalAlpha=1;

 C.globalAlpha=.4;
 aGlowText(C,true);
 C.font=`500 ${Math.max(10,S2*.030)}px 'IBM Plex Mono',ui-monospace,monospace`;
 C.fillText(ch.title.toUpperCase(),W/2,H*.12);
 aClearShadow(C);C.globalAlpha=1;
}

function drawAfter(S2){
 const ch=PD_CHAPTERS[ST.chapter];
 if(ST.voiceT>0){
  const since=T-ST.voiceT;
  if(since<6.4){
   const a=Math.min(1,since/.9)*Math.min(1,(6.4-since)/1.2);
   C.globalAlpha=a;
   C.shadowColor='rgba(232,114,154,.55)';C.shadowBlur=18;
   C.fillStyle='#ffd9e8';
   C.font=`italic ${Math.max(15,S2*.050)}px 'Playfair Display',Georgia,serif`;
   aWrap(C,PD_VOICE.line,W*.78).forEach((ln,j,arr)=>
    C.fillText(ln,W/2,H*.46+(j-(arr.length-1)/2)*S2*.070));
   aClearShadow(C);C.globalAlpha=1;
   return;
  }
 }
 aGlowText(C,true);
 C.font=`500 ${Math.max(14,S2*.046)}px 'Playfair Display',Georgia,serif`;
 let y=H*.42;
 String(ch.after).split('\n').forEach(ln=>{
  aWrap(C,ln,W*.76).forEach(w=>{C.fillText(w,W/2,y);y+=S2*.062});
  y+=S2*.020;
 });
 aClearShadow(C);
}

/* ---------- one tap ---------- */
function reverseSpots(){
 const cols=3, rows=Math.ceil(ALL.length/cols), out=[];
 for(let i=0;i<ALL.length;i++){
  const r=Math.floor(i/cols), c2=i%cols;
  out.push({x:W*(.21+.29*c2), y:H*(.31+(.40/Math.max(1,rows-1))*r)});
 }
 return out;
}
function drawGrid(S2,k,wave){
 const spots=reverseSpots();
 ALL.forEach((it,i)=>{
  const sp=spots[i];
  let kk=k;
  if(wave!=null){
   const d=Math.hypot(sp.x-W/2,sp.y-H*.52)/Math.hypot(W/2,H*.5);
   kk=Math.max(0,Math.min(1,(wave-d)*2.6));
  }
  const pop=kk>0?1+Math.sin(Math.min(1,kk)*Math.PI)*.18:1;
  drawObj(it.o,sp.x,sp.y,S2*.105*pop,kk);
 });
}
function drawReverse(S2){
 drawGrid(S2,0,null);
 aGlowText(C,true);
 C.font=`600 ${Math.max(16,S2*.056)}px 'Playfair Display',Georgia,serif`;
 C.fillText('Now put it back.',W/2,H*.16);
 C.font=`400 ${Math.max(11,S2*.033)}px Lora,Georgia,serif`;
 C.globalAlpha=.75;
 C.fillText('one tap is all it takes',W/2,H*.205);
 C.globalAlpha=1;aClearShadow(C);
 const pulse=1+Math.sin(T*2.2)*.09;
 const bx=W/2, by=H*.84, br=S2*.075*pulse;
 const g=C.createRadialGradient(bx,by,0,bx,by,br*2.1);
 g.addColorStop(0,'rgba(244,160,188,.38)');
 g.addColorStop(1,'rgba(244,160,188,0)');
 C.fillStyle=g;C.beginPath();C.arc(bx,by,br*2.1,0,7);C.fill();
 C.fillStyle='#e8729a';
 C.beginPath();
 C.moveTo(bx,by+br*.45);
 C.bezierCurveTo(bx-br*1.3,by-br*.45,bx-br*.6,by-br*1.35,bx,by-br*.55);
 C.bezierCurveTo(bx+br*.6,by-br*1.35,bx+br*1.3,by-br*.45,bx,by+br*.45);
 C.fill();
}
function drawBloom(S2,dt){
 ST.bloomT+=dt;
 const w=Math.min(1.4,ST.bloomT/1.9);
 drawGrid(S2,1,w);
 if(ST.bloomT<1.1)chromaSplit(6*(1-ST.bloomT/1.1));
 if(ST.bloomT>3.1){ST.phase='joy';ST.joy=0;ST.joyT=0;paintBar()}
}

/* ---------- the opposite of the day ---------- */
function drawJoy(S2,dt){
 ST.joyT+=dt;
 const sc=PD_JOY[ST.joy];
 const DUR=9.0;
 const p=Math.min(1,ST.joyT/DUR);
 const fade=Math.min(aEase(Math.min(1,ST.joyT/.6)),
                     aEase(Math.min(1,(DUR+1.1-ST.joyT)/.7)));
 C.globalAlpha=fade;
 try{sc.draw(C,W/2,H*.42,S2,T,p)}catch(e){}
 if(p>.58){
  const a=Math.min(1,(p-.58)/.2);
  C.globalAlpha=fade*a;
  aGlowText(C,true);
  C.font=`500 ${Math.max(15,S2*.048)}px 'Playfair Display',Georgia,serif`;
  let y=H*.74;
  String(sc.line).split('\n').forEach(ln=>{
   aWrap(C,ln,W*.82).forEach(w=>{C.fillText(w,W/2,y);y+=S2*.058});
  });
  aClearShadow(C);
 }
 C.globalAlpha=1;
 if(ST.joyT>DUR+1.1)nextJoy();
}
function nextJoy(){
 ST.joy++;ST.joyT=0;
 if(ST.joy>=PD_JOY.length){ST.phase='letter';ST.letterT=0}
 paintBar();
}

function drawLetter(S2,dt){
 ST.letterT+=dt;
 aGlowText(C,true);
 C.font=`400 ${Math.max(14,S2*.042)}px Lora,Georgia,serif`;
 let y=H*.20;
 PD_LETTER.forEach((ln,i)=>{
  const a=Math.min(1,Math.max(0,(ST.letterT-i*1.5)/1.1));
  C.globalAlpha=a;
  aWrap(C,ln,W*.82).forEach(w=>{C.fillText(w,W/2,y);y+=S2*.054});
  y+=S2*.028;
 });
 C.globalAlpha=1;aClearShadow(C);
}

/* ---------- taps ---------- */
CV.addEventListener('pointerdown',()=>{
 if(ST.phase==='reverse'){ST.phase='bloom';ST.bloomT=0;paintBar();return}
 if(ST.phase==='joy'&&ST.joyT>1.2){nextJoy();return}
},{passive:true});

$('#pYes').onclick=()=>toTear();
$('#pNo').onclick=()=>{
 /* she said no, which is the answer this was built for */
 ST.forced=true;ST.phase='force';ST.pt=0;$('#pchoice').hidden=true;paintBar();
};

/* ---------- bench controls ---------- */
function paintBar(){
 const L={normal:'morning · an ordinary day',
          warn:'morning · the warning',
          ask:'morning · her choice',
          force:'morning · she said no',
          tear:'morning · going through',
          chapter:PD_CHAPTERS[ST.chapter].at+' · '+PD_CHAPTERS[ST.chapter].title,
          after:PD_CHAPTERS[ST.chapter].at+' · she closes it',
          reverse:'night · one tap to put it back',
          bloom:'night · it comes back',
          joy:'night · '+(ST.joy+1)+' of '+PD_JOY.length,
          letter:'night · the letter'};
 $('#pwhere').textContent=L[ST.phase]||'';
 $('#pnext').textContent=(ST.phase==='letter')?'restart':'next →';
 $('#pstop').hidden=!(ST.chapter>=1&&(ST.phase==='chapter'||ST.phase==='after'));
}
function nextStep(){
 const p=ST.phase;
 if(p==='letter'){restart();return}
 if(p==='normal'){ST.phase='warn';ST.pt=0;paintBar();return}
 if(p==='warn'){ST.phase='ask';ST.pt=0;$('#pchoice').hidden=false;paintBar();return}
 if(p==='ask'||p==='force'){toTear();return}
 if(p==='tear'){ST.pt=2.9;return}
 if(p==='reverse'){ST.phase='bloom';ST.bloomT=0;paintBar();return}
 if(p==='bloom'){ST.phase='joy';ST.joy=0;ST.joyT=0;paintBar();return}
 if(p==='joy'){nextJoy();return}
 if(ST.chapter>=PD_CHAPTERS.length-1&&p==='after'){toReverse();return}
 if(p==='after'){ST.chapter++;ST.phase='chapter';ST.beat=0;ST.beatT=0;
                 ST.voiceT=-1;ST.flickerAt=T+2}
 else {ST.phase='after'; if(PD_VOICE.chapter===PD_CHAPTERS[ST.chapter].id)ST.voiceT=T}
 paintBar();
}
function toReverse(){ST.phase='reverse';paintBar()}
function restart(){
 Object.assign(ST,{phase:'normal',pt:0,chapter:0,beat:0,beatT:0,bloomT:0,
                   joy:0,joyT:0,letterT:0,voiceT:-1,flickerAt:T+2,forced:false});
 $('#pchoice').hidden=true;paintBar();
}
$('#pnext').onclick=nextStep;
$('#prestart').onclick=restart;
$('#phide').onclick=()=>{document.body.dataset.bench='0'};
$('#pshow').onclick=()=>{document.body.dataset.bench='1'};
$('#pstop').onclick=()=>{$('#pask').hidden=false};
$('#paskStay').onclick=()=>{$('#pask').hidden=true};
$('#paskGo').onclick=()=>{$('#pask').hidden=true;toReverse()};

size();addEventListener('resize',size);
paintBar();
raf=requestAnimationFrame(frame);

/* a door for the harness, so a test can jump straight to a phase */
try{window.__pd={get ST(){return ST},PD_JOY,nextJoy,paintBar,
 goJoy(i){ST.phase='joy';ST.joy=i||0;ST.joyT=0;paintBar()} }}catch(e){}
})();
</script>
</body>
